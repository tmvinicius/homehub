info:
  name: Refresh Access Token HomeHub
  type: http
  seq: 4

http:
  method: POST
  url: http://localhost:8080/api/auth/refresh
  body:
    type: json
    data: |-
      {
        "token": "admin@homehub.com"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
